
name: Build Sary ERPNext v15

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Sary repository
        uses: actions/checkout@v4

      - name: Checkout frappe_docker v15
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: version-15
          path: frappe_docker

      - name: Prepare private app credentials
        env:
          AGAMY_TOKEN: ${{ secrets.AGAMY_GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("apps.json", encoding="utf-8") as f:
              apps = json.load(f)

          private_url = "https://github.com/agamycode/agamy_accounting_custom_app"
          token = os.environ["AGAMY_TOKEN"]

          if not token:
              raise SystemExit("AGAMY_GITHUB_TOKEN is missing")

          found = False
          for app in apps:
              if app["url"].rstrip("/").removesuffix(".git") == private_url:
                  app["url"] = (
                      "https://x-access-token:"
                      + token
                      + "@github.com/agamycode/agamy_accounting_custom_app.git"
                  )
                  found = True

          if not found:
              raise SystemExit(
                  "Private app URL not found in apps.json. Check its URL."
              )

          with open("apps.private.json", "w", encoding="utf-8") as f:
              json.dump(apps, f)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Sary image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sary-erpnext-v15
        run: |
          docker buildx build \
            --build-arg FRAPPE_BRANCH=version-15 \
            --build-arg FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg CACHE_BUST="${GITHUB_RUN_ID}" \
            --secret id=apps_json,src=apps.private.json \
            --file frappe_docker/images/layered/Containerfile \
            --tag "${IMAGE}:v15" \
            --tag "${IMAGE}:latest" \
            --push \
            frappe_docker

      - name: Remove temporary credentials file
        if: always()
        run: rm -f apps.private.json
